
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Escolar Search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Style.css') }}">
</head>

<body class="pagina-autenticacao">

    <main class="conta-main">

        <section class="painel-conta painel-login">

            <div class="conta-detalhe conta-detalhe-um"></div>
            <div class="conta-detalhe conta-detalhe-dois"></div>

            <div class="conta-conteudo">

                <span class="conta-identificador">ESCOLAR SEARCH</span>

                <h1 class="titulo-conta">Entrar na conta</h1>

                <p class="subtitulo-conta">
                    Acesse sua conta para continuar.
                </p>

                {% with mensagens = get_flashed_messages(with_categories=true) %}
                    {% for categoria, mensagem in mensagens %}
                        <p class="mensagem {{ categoria }}">{{ mensagem }}</p>
                    {% endfor %}
                {% endwith %}

                <form method="POST" class="formulario-conta">

                    <label class="campo-conta">
                        <span>E-mail</span>
                        <input
                            type="email"
                            name="email"
                            placeholder="Seu e-mail"
                            required
                            autocomplete="email">
                    </label>

                    <label class="campo-conta">
                        <span>Senha</span>
                        <input
                            type="password"
                            name="senha"
                            placeholder="Sua senha"
                            required
                            autocomplete="current-password">
                    </label>

                    <button type="submit" class="botao-principal-conta">
                        Entrar
                    </button>

                </form>

                <div class="alternativa-conta">
                    <span>Ainda não tem conta?</span>
                    <a class="botao-link-conta" href="{{ url_for('cadastro') }}">
                        Cadastre-se
                    </a>
                </div>

                <a class="botao-voltar-conta" href="{{ url_for('inicio') }}">
                    ← Voltar ao início
                </a>

            </div>
        </section>

    </main>

</body>
</html>
