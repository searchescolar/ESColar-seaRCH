<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - Escolar Search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Style.css') }}">
</head>
<body>
<main>
    <h1 class="titulo">Criar conta</h1>
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensagem in mensagens %}
        <p class="mensagem {{ categoria }}">{{ mensagem }}</p>
      {% endfor %}
    {% endwith %}
    <form method="POST" class="formulario-conta">
        <input type="text" name="nome" placeholder="Seu nome" required maxlength="100" autocomplete="name">
        <input type="email" name="email" placeholder="Seu e-mail" required maxlength="150" autocomplete="email">
        <input type="password" name="senha" placeholder="Crie uma senha (mínimo 8 caracteres)" required minlength="8" autocomplete="new-password">
        <input type="password" name="confirmar_senha" placeholder="Confirme sua senha" required minlength="8" autocomplete="new-password">
        <button type="submit">Cadastrar</button>
    </form>
    <p class="texto">Já tem uma conta? <a href="{{ url_for('login') }}">Faça login</a></p>
    <p><a href="{{ url_for('inicio') }}">Voltar ao início</a></p>
</main>
</body>
</html>
